aid: kataai
name: Kata.ai
description: >-
  Kata.ai is an Indonesian enterprise conversational-AI company that builds AI
  agents and chatbots for customer experience, marketing, sales, and HR across
  financial services, retail, healthcare, automotive, and government. Its
  developer-facing Kata Platform lets teams create bot projects that bundle a
  Bot, CMS, and a Natural Language Understanding (NLU) model, then deploy them
  and connect messaging channels such as LINE, Telegram, WhatsApp, Facebook
  Messenger, Slack, and Qiscus. Kata.ai exposes a public REST API for managing
  projects, bots, deployments, environments, channels, teams, and NLUs, an NL
  Prediction API for entity extraction from a trained model, the kata command
  line tool, and the Aksara design system. Backed by 500 Global.
